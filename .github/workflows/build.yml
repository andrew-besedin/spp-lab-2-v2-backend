name: Build

on:
    push:
        branches: [main, master]
    pull_request:
    workflow_dispatch:

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npx eslint api

            - name: Type check
              run: npx tsc --noEmit -p .
